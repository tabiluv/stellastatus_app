name: Release

# v* 태그를 푸시하면 커스텀 인스톨러(스텔라리움 Setup.exe)를 빌드해 GitHub Releases 에 업로드한다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build custom installer (스텔라리움 Setup.exe)
        run: npm run build-setup

      # 태그가 vX.Y.Z.n (네 자리) 이면 베타(Pre-release), vX.Y.Z 이면 정식(Latest)으로 표시한다.
      # (VERSIONING.md 의 버전 규칙과 일치. 업데이터는 '베타 버전 받기' 토글이 켜진 사용자에게만
      #  Pre-release 를 안내하므로, 여기서 prerelease 플래그를 올바로 세팅하는 것이 중요하다.)
      - name: Determine release channel
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "→ 베타(Pre-release) 릴리스: ${GITHUB_REF_NAME}"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "→ 정식(Latest) 릴리스: ${GITHUB_REF_NAME}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 스텔라리움 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist-installer/*.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS(.dmg) ──────────────────────────────────────
  # .dmg 는 macOS 에서만 빌드 가능하므로 별도 러너에서 만든 뒤, 위에서 만든 같은 릴리스에 첨부한다.
  # (미서명 빌드 — 인증서 없이 산출물만. Gatekeeper 경고는 남는다.)
  build-mac:
    needs: build            # Windows 잡이 릴리스를 먼저 생성한 뒤 실행
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build macOS dmg (unsigned)
        # arch 를 명시하지 않으면 호스트(arm64)만 빌드된다. Intel(x64) 까지 만들려면 둘 다 지정.
        # ⚠️ productName 을 반드시 ASCII("Stellarium")로 오버라이드한다.
        #    (electron-builder.yml 의 productName='스텔라리움' 를 그대로 쓰면 헬퍼 앱이
        #     '스텔라리움 Helper (GPU).app' 처럼 한글 경로가 되어, macOS 에서 앱이
        #     실행 시 SIGTRAP 으로 크래시한다. Windows 는 한글 productName 이 문제없다.)
        run: npx electron-builder --mac dmg --arm64 --x64 -c.productName=Stellarium --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 미서명: 키체인 인증서 자동탐색 비활성화

      - name: Upload dmg to release
        run: gh release upload "${{ github.ref_name }}" dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
